name: Build and Upload Static Site

on:
  workflow_dispatch:
  push:
    branches:
#      - main
      - new-site

env:
  ACTIONS_STEP_DEBUG: true
  ACTIONS_RUNNER_DEBUG: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Debug List .gitmodules file
        run: ls -la .gitmodules || echo ".gitmodules not found"

      - name: Remove lingering .gitmodules file
        run: rm -f .gitmodules

      - name: Checkout page-scribe-static-flow repository
        uses: actions/checkout@v4
        with:
          repository: as-a-discipline/page-scribe-static-flow
          path: _website/page-scribe-static-flow

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Make build.sh executable
        run: chmod +x ./build.sh

      - name: Run build.sh
        run: ./build.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: static-site-dist
          path: _website/page-scribe-static-flow/dist


  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
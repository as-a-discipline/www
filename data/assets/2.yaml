overview: This tool uses the Rumsfeld Matrix—originally made famous by U.S. Secretary 
  of Defense Donald Rumsfeld—as a cognitive framing device for engineering and architecture. 
  It helps teams categorize assumptions, expose uncertainty, and address what they don't know 
  they don't know. The matrix is useful for de-risking decisions, shaping experiments, and planning iterations.
whatsIncluded:
- Excalidraw canvas with labeled 2x2 Rumsfeld Matrix
- Workshop facilitation guide with step-by-step instructions
#- Companion MARP slide deck for facilitators
howToUse:
- Open the Excalidraw template
- In a workshop or review session, gather team inputs for each quadrant
  - "Known Knowns: What we’re sure of (validated knowledge)"
  - "Known Unknowns: What we know we need to find out"
  - "Unknown Knowns: What someone knows but hasn’t shared"
  - "Unknown Unknowns: Risks or gaps we haven’t yet identified"
- Use color or shape coding to assign ownership, priority, or concern
- Convert top risks or unknowns into follow-up experiments or decisions
keyFeatures:
- Simple but powerful framing for risk and assumption mapping
- Designed for team workshops and architectural discussions
- Includes printable and digital facilitation assets
- Great for use in early-stage design, RFC reviews, or milestone planning

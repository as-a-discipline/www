framework:
  title: The Rumsfeld Matrix
  description: A 2x2 knowledge framework distinguishing four types of understanding
  dimensions:
    - name: Known Knowns
      description: Facts, decisions, and validated knowledge
    - name: Known Unknowns
      description: Questions and risks that are recognized and can be investigated
    - name: Unknown Knowns
      description: Unspoken assumptions or distributed knowledge that needs surfacing
    - name: Unknown Unknowns
      description: Blind spots, surprises, or risks that haven't been considered
sampleQuestions:
- What assumptions are we treating as facts?
- What do we know we still need to research or test?
- What tribal knowledge or undocumented decisions might affect us?
- How can we reduce exposure to unforeseen surprises?
